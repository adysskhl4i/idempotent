[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adysskhl4i-idempotent"
version = "0.1.0"
description = "识别非幂等的操作与缺失的幂等键，标出重复执行的风险点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "adysskhl4i" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://adysskhl4i.github.io"
Repository = "https://github.com/adysskhl4i/idempotent"
Issues = "https://github.com/adysskhl4i/idempotent/issues"

[project.scripts]
idempotent = "idempotent:main"

[tool.setuptools]
py-modules = ["idempotent"]
